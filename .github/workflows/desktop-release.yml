# Builds the Grok Build Desktop installers.
#
# macOS is the reason this workflow exists. A .dmg can only be produced on
# macOS, so there is no way to cut a Mac build from the Windows dev box — the
# macos-latest runner IS the build host. Windows is built here too so both
# installers come out of the same commit and the same npm ci, rather than one
# from CI and one from whatever happened to be on a laptop.
#
# macOS is signed and notarised. The Developer ID identity arrives as CSC_LINK /
# CSC_KEY_PASSWORD and notarisation authenticates with an App Store Connect API
# key (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) — five repository
# secrets; four go to electron-builder as-is and the key itself is staged to a
# file first, for the reason given at that step. Windows stays unsigned:
# SmartScreen reputation is earned through download volume and, since Microsoft
# dropped EV's automatic reputation in 2024, no certificate removes that warning
# outright. So a first-run SmartScreen prompt is still expected on Windows and is
# called out on the download page; Gatekeeper no longer prompts on macOS.
#
# There is deliberately NO `signAndEditExecutable: false` on the Windows side.
# It reads as "we are unsigned, so skip signing", but it also skips the EDIT
# half — rcedit, which stamps the icon and version metadata onto the .exe — and
# 3.2.0 shipped wearing Electron's atom on the Start menu and taskbar because of
# it. electron-builder already skips signing on its own when no certificate is
# configured; it logs "no signing info identified" and carries on.
#
# Manual by design. Publishing installers is the owner's call, so this never
# fires on a push: dispatch it, and it uploads to the run's artifacts. Only a
# `release_tag` input attaches them to a GitHub Release, and only when that
# release already exists — this workflow does not create one.
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach installers to (leave empty to only upload run artifacts)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PINNED, not macos-latest. `latest` had rolled to macos-26-arm64, and
          # two consecutive signing runs died the same way on it: notarytool
          # uploaded fine — Apple issued a submission id — then could not reach
          # appstoreconnect.apple.com to poll for the result, reporting "No
          # network route" with DNS resolving zero endpoints. Submit and poll are
          # different hosts, so upload-succeeds/poll-fails is coherent, and it is
          # not something this repo can fix in config.
          #
          # Beyond that specific fault: a release pipeline should not have its
          # build host change underneath it without a commit. Bump this
          # deliberately, after a green run, never by inheriting `latest`.
          - os: macos-15
            script: dist:mac
            name: macos
          - os: windows-latest
            script: dist:win
            name: windows
          # Linux builds two artifacts from one electron-builder run: the AppImage
          # (cloud hosts extract it; desks can run the file) and a .deb for
          # Debian and Ubuntu. Unsigned by design: there is nothing to sign
          # either one for. The AppImage filename stays the versioned
          # x86_64 asset the fleet selects by extension.
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    # Measured, not guessed: a healthy signed+notarised run is ~6 minutes total,
    # with Apple answering each submission in about 90 seconds. This was briefly
    # 120 on the theory that notarisation was slow — it is not. The two runs that
    # burned two hours were a broken build host silently retrying a status poll,
    # and a ceiling generous enough to hide that is a ceiling that turns a
    # five-minute diagnosis into a two-hour one.
    #
    # 45 leaves an order of magnitude of headroom over the real cost while still
    # making "this is taking a while" mean something.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # electron-builder hands APPLE_API_KEY to `notarytool --key`, which wants a
      # PATH to the .p8 — not the key itself. A repository secret can only hold
      # text, so write it out here and point the env var at the file. RUNNER_TEMP
      # is outside the workspace (nothing can package it by accident) and dies
      # with the runner.
      - name: Stage the notarisation key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_PEM: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_PEM" ]; then
            echo "APPLE_API_KEY secret is empty — notarisation would fail" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_PEM" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # Telemetry identity is injected HERE, not committed, and only for
      # this repository. A fork gets no `grokExtensionName`, so its packaged
      # id stays PawelHuryn.grok-build-desktop, fails the official-id check,
      # and reports nothing — which is the behaviour a fork should have and
      # which no file in the source tree can enforce.
      #
      # The flag is QUOTED, and must stay quoted. The Windows leg runs under
      # pwsh, which splits a bare `-c.extraMetadata.…=…` into `-c` and
      # `.extraMetadata.…=…` before npm ever sees it — electron-builder then
      # reads `-c` as its config-FILE flag and dies with ENOENT on a file named
      # after the value. macOS passes the same token through intact, so this
      # breaks exactly one leg of the matrix and only when the flag is present:
      # v3.15.0's Windows installer failed this way on the first run with it.
      - run: npm run ${{ matrix.script }} -- '-c.extraMetadata.grokExtensionName=grok-vscode-phuryn'
        if: github.repository == 'phuryn/grok-build-vscode'
        env:
          # Harmless on the Windows leg — empty and ignored — so one env block on
          # the matrix step is enough; no need to branch per OS. APPLE_API_KEY is
          # deliberately absent: it comes from GITHUB_ENV above, and a step-level
          # env entry would override it back to the raw key contents.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: L6TFKRX6QQ

      # A fork builds the same installers, signed with its own credentials if
      # it has them, and simply carries no telemetry identity. Same command,
      # minus the injected name.
      - run: npm run ${{ matrix.script }}
        if: github.repository != 'phuryn/grok-build-vscode'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: L6TFKRX6QQ

      # Installers plus the updater channel files (latest.yml / latest-mac.yml).
      # dist-desktop/ also holds unpacked app trees and electron-builder's
      # other metadata, which nobody downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: grok-build-desktop-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.blockmap
            dist-desktop/latest.yml
            dist-desktop/latest-mac.yml
            dist-desktop/latest-linux.yml

      - name: Verify updater metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            f=dist-desktop/latest-mac.yml
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
            grep -Eq 'mac-arm64\.zip\r?$' "$f" || { echo "$f missing mac-arm64.zip" >&2; exit 1; }
            grep -Eq 'mac-x64\.zip\r?$' "$f" || { echo "$f missing mac-x64.zip" >&2; exit 1; }
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Named explicitly rather than left to the else. That else branch
            # used to BE "not macOS", so a third platform falling into it would
            # have looked for win-x64.exe in a file that never mentions it.
            f=dist-desktop/latest-linux.yml
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
            # path stays the AppImage. DebUpdater picks the .deb out of files[]
            # by extension; an old client that still reads path must not be
            # handed the deb.
            grep -Eq '^path: .*linux-x86_64\.AppImage\r?$' "$f" || { echo "$f path is not the AppImage" >&2; exit 1; }
            grep -Eq 'linux-amd64\.deb\r?$' "$f" || { echo "$f missing the deb" >&2; exit 1; }
            shopt -s nullglob
            appimages=(dist-desktop/*.AppImage)
            debs=(dist-desktop/*-linux-amd64.deb)
            [ "${#appimages[@]}" -eq 1 ] || { echo "expected exactly one AppImage, got ${#appimages[@]}" >&2; exit 1; }
            [ "${#debs[@]}" -eq 1 ] || { echo "expected exactly one deb, got ${#debs[@]}" >&2; exit 1; }
          else
            f=dist-desktop/latest.yml
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
            grep -Eq 'win-x64\.exe\r?$' "$f" || { echo "$f missing win-x64.exe" >&2; exit 1; }
          fi

      - name: Attach to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --clobber so re-running after a failed leg replaces a half-uploaded
          # asset instead of erroring on the name already being taken.
          shopt -s nullglob
          files=(dist-desktop/*.dmg dist-desktop/*.zip dist-desktop/*.exe dist-desktop/*.AppImage dist-desktop/*.deb dist-desktop/*.blockmap)
          # Per-platform yml: Windows emits latest.yml, macOS latest-mac.yml,
          # Linux latest-linux.yml.
          if [ -f dist-desktop/latest.yml ]; then files+=(dist-desktop/latest.yml); fi
          if [ -f dist-desktop/latest-mac.yml ]; then files+=(dist-desktop/latest-mac.yml); fi
          if [ -f dist-desktop/latest-linux.yml ]; then files+=(dist-desktop/latest-linux.yml); fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers produced" >&2
            exit 1
          fi
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber

  # Installers are ~470 MB a release and every patch adds another set. GitHub
  # does not bill us for them (public-repo release assets are free and CDN
  # served, which is exactly why the binaries live here and not on the relay),
  # but an unbounded pile is still a pile: 4 releases were already 1.8 GB, and
  # nobody downloads the version-before-last-before-last.
  #
  # Keeps installers on the newest KEEP releases and strips them from older
  # ones. Tags, release notes and the .vsix always stay — the vsix is how a
  # specific extension version is installed, and deleting it would break a
  # legitimate reason to visit an old release. This only ever removes files that
  # can be rebuilt from the tag.
  prune:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Prune old desktop installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "3"
        run: |
          set -euo pipefail
          # Releases that carry installers, newest first. A release with none is
          # not a "kept" slot — otherwise a run of extension-only patches would
          # push every real build out of the window and delete the lot.
          mapfile -t withInstallers < <(
            gh api "repos/$REPO/releases?per_page=100" \
              --jq '.[] | select(.draft | not)
                    | select([.assets[].name] | map(test("-(win-x64[.]exe|mac-(arm64|x64)[.](dmg|zip)|linux-x86_64[.]AppImage|linux-amd64[.]deb)$")) | any)
                    | .tag_name'
          )
          echo "releases with installers: ${withInstallers[*]:-none}"
          if [ "${#withInstallers[@]}" -le "$KEEP" ]; then
            echo "nothing to prune (${#withInstallers[@]} <= $KEEP)"
            exit 0
          fi
          for tag in "${withInstallers[@]:$KEEP}"; do
            echo "pruning installers from $tag"
            mapfile -t assets < <(
              gh api "repos/$REPO/releases/tags/$tag" \
                --jq '.assets[].name | select(test("[.](dmg|zip|exe|AppImage|deb)([.]blockmap)?$") or test("^latest(-mac|-linux)?[.]yml$"))'
            )
            for a in "${assets[@]:-}"; do
              [ -n "$a" ] || continue
              echo "  - $a"
              gh release delete-asset "$tag" "$a" --yes --repo "$REPO"
            done
          done
