# Grok Build Desktop — electron-builder config (signed + notarised on macOS).
# Entry: out/desktop/main.js (see package.json scripts dist / dist:mac / dist:win).
# Does not affect the VS Code VSIX path (npm run package).

appId: com.productcompass.grok-build-desktop
productName: Grok Build Desktop
copyright: Copyright © Paweł Huryn

# Keep installers out of the extension tree; never ship this folder in the VSIX.
directories:
  output: dist-desktop
  buildResources: resources

# Packaged package.json main (extension still uses out/extension.js for VS Code).
extraMetadata:
  main: out/desktop/main.js
  name: grok-build-desktop
  # NOTE: `grokExtensionName` is deliberately NOT set here. It is the telemetry
  # identity, and `name` above becomes the asar package name, so
  # `${publisher}.${name}` is PawelHuryn.grok-build-desktop and never matches
  # OFFICIAL_EXTENSION_ID — which means a build made from this file alone
  # reports nothing. That is the wanted default for a local build and for any
  # fork.
  #
  # The official value is injected by .github/workflows/desktop-release.yml, and
  # only when the workflow is running in THIS repository. Nothing that ships in
  # the source tree can distinguish our build from a fork's: a fork copies every
  # file, and a desktop-only fork has no reason to change `publisher`, which is
  # a VS Code Marketplace concept. The repository it builds from is the one
  # signal it cannot inherit by copying.
  # rcedit stamps `description` as the .exe FileDescription, which is the label
  # Windows shows in Task Manager and the UAC prompt. package.json's is the
  # marketplace blurb — a 300-character paragraph in a column meant for a name.
  description: Grok Build Desktop (Community)

# Layout inside app.asar (or app/ when --dir):
#   package.json, out/**, media/**, resources/**, LICENSE, node_modules/{ws,jpeg-js,@agentclientprotocol/codex-acp}
# resolveExtensionRoot() expects media/chat.js at the package root (see src/desktop/paths.ts).
files:
  - package.json
  - LICENSE
  - out/**/*
  - media/**/*
  - resources/**/*
  - node_modules/ws/**/*
  - node_modules/jpeg-js/**/*
  - node_modules/@agentclientprotocol/codex-acp/package.json
  - node_modules/@agentclientprotocol/codex-acp/dist/**/*
  - node_modules/@agentclientprotocol/codex-acp/LICENSE
  - node_modules/@agentclientprotocol/claude-agent-acp/package.json
  - node_modules/@agentclientprotocol/claude-agent-acp/dist/**/*
  - node_modules/@agentclientprotocol/claude-agent-acp/LICENSE
  - node_modules/@agentclientprotocol/sdk/package.json
  - node_modules/@agentclientprotocol/sdk/dist/**/*
  - node_modules/@agentclientprotocol/sdk/LICENSE-APACHE
  - node_modules/@anthropic-ai/claude-agent-sdk/package.json
  - node_modules/@anthropic-ai/claude-agent-sdk/*.mjs
  - node_modules/@anthropic-ai/claude-agent-sdk/*.js
  - node_modules/zod/**/*
  # LOAD-BEARING. The honest lockfile installs the adapter's declared tree,
  # and electron-builder packs the full hoisted production tree of every
  # direct dep — verified in the built asar, which carries zod, vscode-jsonrpc
  # and open's helpers. Without these lines @openai/codex's ~350 MB platform
  # binary (hoisted to node_modules/@openai) and the adapter's nested
  # conflict copies (diff@9, open@11) land in app.asar. Only NEGATIVE
  # patterns reach the node_modules matcher, so a blocklist is the one tool
  # here; the small hoisted helpers that still ride along are harmless.
  - "!node_modules/@openai/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!node_modules/@agentclientprotocol/codex-acp/node_modules/**"
  - "!node_modules/@agentclientprotocol/claude-agent-acp/node_modules/**"
  - "!out/**/*.map"
  - "!**/*.{ts,tsx,md}"

asar: true
asarUnpack:
  - "resources/macos-dual-cmd-listener"

# macOS only (the hook returns immediately on every other platform).
afterPack: scripts/adhoc-sign-mac.cjs

# Predictable GitHub Release asset names for the download page:
#   Grok-Build-Desktop-<version>-mac-arm64.dmg
#   Grok-Build-Desktop-<version>-mac-x64.dmg
#   Grok-Build-Desktop-<version>-win-x64.exe
# ${os} is electron-builder's short name: mac | win | linux
artifactName: Grok-Build-Desktop-${version}-${os}-${arch}.${ext}

# Generate latest.yml / latest-mac.yml only. Upload stays in
# desktop-release.yml — every dist* script passes `--publish never`.
# Client feed is the relay (setFeedURL), not this URL; per-platform
# blocks bake a matching app-update.yml so a missed setFeedURL still
# hits the right directory.
publish:
  provider: generic
  url: https://afkpilot.com/update/win

# App icon. Round, with transparency outside the disc: the square version sat on
# an opaque white tile, which reads as a sticker on a dark Windows taskbar and
# does not match how macOS masks dock icons either. A plain transparent
# background was not an option — the mark itself is dark, so it would vanish in
# dark mode.
#
# NOT resources/grok-icon.png: that one is the VS Code marketplace listing icon
# and is deliberately left alone.
#
# Set PER PLATFORM, not once at the root. A root-level `icon` did not reach the
# packaged executable — 3.2.0 installed with Electron's atom on the Start menu
# entry and the taskbar, while the installer .exe (which NSIS resolves
# separately) correctly showed the Grok mark. `resources/icon.ico` doubles as
# the conventional buildResources name, so it is found even if a block is ever
# dropped. electron-builder requires >=256 for NSIS / macOS targets.

# Signed + notarised with a Developer ID Application certificate (Team
# L6TFKRX6QQ). CI supplies the identity as CSC_LINK / CSC_KEY_PASSWORD and the
# notarisation credentials as APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
# (see .github/workflows/desktop-release.yml and docs/macos-code-signing.md).
#
# Locally, electron-builder still signs if the certificate is in the keychain —
# that is its own auto-discovery, no env var needed — and skips notarisation with
# a log line when the API key is absent. On a Mac with no certificate it signs
# nothing and the afterPack hook ad-hoc signs instead, which is the only thing
# keeping such a build loadable at all on Apple silicon. See the hook.
mac:
  icon: resources/grok-icon-round-512.png
  category: public.app-category.developer-tools
  # Mandatory for notarisation, and the reason entitlements exist: hardened
  # runtime disables the JIT and the dyld env vars Electron needs.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  # Not redundant. Electron's helper processes inherit their entitlements
  # separately; omitting this is the classic "main process starts, window is
  # blank" failure.
  entitlementsInherit: resources/entitlements.mac.plist
  # Team ID rides in APPLE_TEAM_ID (see the workflow), not here: electron-builder
  # 25 deprecated `notarize.teamId` and warns when it is set. `true` only means
  # "do not skip" — with no credentials in the env (a local build) it logs that
  # it skipped notarisation and carries on.
  notarize: true
  extendInfo:
    # Not optional. Asking for the microphone with no usage string does not
    # prompt the user — macOS terminates the process, and it presents as a
    # crash rather than as a permissions problem.
    NSMicrophoneUsageDescription: >-
      Grok Build Desktop uses the microphone for voice input in chat.
  # Both arches in ONE electron-builder invocation so latest-mac.yml lists
  # both zips. A second arch job would overwrite the first (#5592).
  publish:
    provider: generic
    url: https://afkpilot.com/update/mac
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  # ${arch} matters: without it the arm64 and x64 builds both mount a volume
  # called "Grok Build Desktop <version>", and the second one races the first's
  # unmount — hdiutil detach then fails on a volume that is already gone or
  # still busy, which is what killed the first macOS run.
  title: Grok Build Desktop ${version} ${arch}

win:
  # An explicit multi-size .ico rather than relying on the PNG conversion, so
  # every Windows surface draws the same mark at every size.
  icon: resources/icon.ico
  # `signAndEditExecutable: false` used to sit here, reasoning "unsigned, so
  # nothing to sign". It does more than its first word says: it also skips the
  # EDIT step (rcedit), which is what stamps the icon and version metadata onto
  # the .exe. That is why 3.2.0 installed with Electron's atom on the Start menu
  # and the taskbar while the installer itself looked right — NSIS resolves its
  # own icons separately. It was never needed: with no certificate configured
  # electron-builder already logs "no signing info identified, signing is
  # skipped" and moves on.
  # Unsigned until an Authenticode cert lands — do not embed publisherName.
  verifyUpdateCodeSignature: false
  publish:
    provider: generic
    url: https://afkpilot.com/update/win
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  # The wizard's own icons are resolved separately from `win.icon` and from each
  # other, so name all three: the installer .exe as Explorer draws it, the
  # uninstaller, and the small mark in the wizard header.
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Grok Build Desktop
  uninstallDisplayName: Grok Build Desktop (Community)
  artifactName: Grok-Build-Desktop-${version}-${os}-${arch}.${ext}

linux:
  icon: resources/grok-icon-round-512.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
